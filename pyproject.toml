[project]
name = "growth-horizon"
version = "0.1.0"
description = "Growth-condition benchmark under taxonomic holdout"
requires-python = ">=3.13,<3.14"
dependencies = [
  "biopython==1.85",
  "hmmlearn==0.3.3",
  "joblib==1.3.2",
  "numpy==2.2.6",
  "scikit-learn==1.7.2",
]

[dependency-groups]
dev = ["mypy==1.18.2", "pytest==8.4.2", "ruff==0.13.3"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
